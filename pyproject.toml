[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qsafety-qae"
version = "0.1.2"
description = "Quantum amplitude estimation tools for safety and reliability probability models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "Ugwiyeon Lee", email = "lyullee@gmail.com"},
]
keywords = ["quantum computing", "amplitude estimation", "safety", "reliability", "monte carlo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
qiskit = ["qiskit>=2.2,<3", "qiskit-aer>=0.17,<1"]
ibm = ["qsafety-qae[qiskit]", "qiskit-ibm-runtime>=0.43,<1"]
dev = ["build>=1.2", "pytest>=8", "pytest-cov>=5", "ruff>=0.9", "twine>=6"]

[project.scripts]
qsafety = "qsafety.cli:main"

[project.urls]
Homepage = "https://github.com/lyullee/qsafety-qae"
Documentation = "https://github.com/lyullee/qsafety-qae#readme"
Issues = "https://github.com/lyullee/qsafety-qae/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
include = ["src/**/*.py", "tests/**/*.py"]
