name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qsafety-qae
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,qiskit,research]"
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python -c "import os, tomllib, qsafety;
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version'];
          assert os.environ['RELEASE_TAG'] == 'v' + version;
          assert qsafety.__version__ == version"
      - run: python scripts/audit_public_release.py
      - run: python -m pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
